<!-- Left to Right Animation -->

<!-- <!DOCTYPE html>
<html>
<head>
<style>
.box {
  width: 100px;
  height: 100px;
  background-color: blue;
  animation: move 2s infinite;
}

@keyframes move {
  0%   { transform: translateX(0); }
  100% { transform: translateX(200px); }
}
</style>
</head>
<body>

<div class="box"></div>

</body>
</html> -->


<!-- Property : Purpose
animation  ->	Applies animation
@keyframes ->	Defines animation steps
transform  ->	Changes position/size/rotation
translateX() ->	Moves element horizontally
0% ->	Start state
100% ->	End state -->




<!-- Hover Animation -->

<!DOCTYPE html>
<html>
<head>
<style>

.box {
  width: 150px;
  height: 150px;
  background-color: blue;
  transition: 0.5s;
}

.box:hover {
  transform: scale(1.2);
}

</style>
</head>
<body>

<div class="box"></div>

</body>
</html>
